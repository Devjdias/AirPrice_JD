[GSHEETS]
# Preencha arquivo_credenciais e id_planilha para ativar o envio automático.
# Caminhos relativos são resolvidos a partir da pasta em que o Python é iniciado.
arquivo_credenciais =
id_planilha =
nome_aba = Dados

[ANTIDETECT]
# Aplica pausas variáveis em partes da coleta. Padrão True.
humanize = True
# HTML temporário compactado. A limpeza pode ocorrer no mesmo experimento.
save_html = False
# Capturas em tentativas sem resultado ou com erro e sessão ainda válida.
screenshot = False

[PROXY]
# Um proxy é escolhido por experimento e passado ao Chrome via --proxy-server.
enabled = False
# Para vários proxies, use linhas indentadas abaixo de list, no formato host:porta.
list =

[CHROME]
# Caminho completo do executável do Chrome, sem aspas. Vazio ativa a detecção.
# Windows usa Program Files, Program Files (x86), LocalAppData e registro.
# Linux busca executáveis no PATH. macOS também verifica /Applications.
path =
